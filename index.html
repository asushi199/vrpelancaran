<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Majlis Pelancaran — Program Sokongan Profesional: Dasar Pendidikan Digital</title>

    <!-- Vendored locally so it also works offline at the venue -->
    <script src="vendor/aframe.min.js"></script>
    <script src="js/launch.js" defer></script>

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060f;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

    </style>
  </head>

  <body>
    <!-- Operator-only note (desktop). Auto-hides once VR starts so it is never
         part of the scene the audience sees. -->
    <div id="hint" hidden>
      Operator sahaja &nbsp;·&nbsp; SPACE / L = mula &nbsp;·&nbsp; ESC = tutup filem
    </div>

    <a-scene
      launch-sequence
      background="color: #000005"
      renderer="colorManagement: true; antialias: true; exposure: 1; toneMapping: no"
      loading-screen="dotsColor: #d6b06a; backgroundColor: #05060f"
    >
      <!-- ============ ASSETS ============ -->
      <a-assets>
        <!--
          360° IMMERSIVE ENVIRONMENT (equirectangular loop).
          Swap assets/space360.mp4 for any royalty-free 360 clip you own.
          Plays muted + looped and wraps fully around the audience.
        -->
        <video
          id="v360"
          src="assets/space360.mp4"
          preload="auto"
          loop
          muted
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
        <!--
          OPENING FILM. Drop your file at assets/opening.mp4 (MP4 / H.264).
          If missing, a placeholder panel is shown automatically.
        -->
        <video
          id="openingVideo"
          src="assets/opening.mp4"
          preload="auto"
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
        <img id="palmOrbTexture" src="assets/palm-energy-orb.png" />
      </a-assets>

      <!-- ============ 360 WORLD (wraps the whole audience) ============ -->
      <a-videosphere
        id="sky360"
        src="#v360"
        rotation="0 -90 0"
        radius="500"
        segments-height="64"
        segments-width="64"
        material="shader: flat; fog: false; npot: true"
        sharp-video
      ></a-videosphere>

      <!-- Dimmer shell: fades in on launch so the film reads cinematically -->
      <a-sphere
        id="dimmer"
        radius="60"
        material="color: #000005; shader: flat; side: back; opacity: 0; transparent: true; fog: false; depthWrite: false"
      ></a-sphere>

      <!-- ============ LIGHTS (for the floating orb only) ============ -->
      <a-entity light="type: ambient; color: #22314f; intensity: 0.6"></a-entity>
      <a-entity
        id="keyLight"
        light="type: point; color: #7fb0ff; intensity: 0.9; distance: 12; decay: 1"
        position="0 3 -1"
      ></a-entity>

      <!-- ============ LIGHT BEAM (shoots up on launch) ============ -->
      <a-cylinder
        id="beam"
        radius="0.22"
        height="0.1"
        position="0 0 -1.6"
        visible="false"
        material="color: #cfe0ff; emissive: #cfe0ff; emissiveIntensity: 2; opacity: 0.5; transparent: true; side: double; fog: false"
      ></a-cylinder>

      <!-- ============ FLOATING TITLE (billboarded in front of the leader) ============ -->
      <a-entity id="screenLogo" position="0 2.38 -4">
        <!-- Layered midnight glass panel -->
        <a-plane
          width="4.6"
          height="1.72"
          position="0 0 -0.02"
          material="color: #020711; emissive: #030b1d; emissiveIntensity: 0.45; opacity: 0.76; transparent: true; side: double; fog: false"
        ></a-plane>
        <a-plane
          width="4.42"
          height="1.54"
          position="0 0 -0.01"
          material="color: #06162d; emissive: #09214a; emissiveIntensity: 0.38; opacity: 0.34; transparent: true; side: double; fog: false"
        ></a-plane>

        <!-- Ceremonial gold crown line -->
        <a-plane
          width="4.6"
          height="0.018"
          position="0 0.86 0.01"
          material="color: #e1bf70; emissive: #c99a3c; emissiveIntensity: 1.2; fog: false"
        ></a-plane>
        <a-text
          value="MAJLIS PELANCARAN"
          align="center"
          color="#e8cb82"
          width="3.55"
          wrap-count="24"
          letter-spacing="7"
          position="0 0.53 0.02"
        ></a-text>

        <!-- Deliberate divider separating ceremony from programme -->
        <a-plane
          width="1.5"
          height="0.014"
          position="0 0.29 0.02"
          material="color: #d6b06a; emissive: #d6b06a; emissiveIntensity: 1.25; fog: false"
        ></a-plane>
        <a-sphere
          radius="0.026"
          position="-0.82 0.29 0.02"
          material="color: #d6b06a; emissive: #d6b06a; emissiveIntensity: 1.5; shader: flat; fog: false"
        ></a-sphere>
        <a-sphere
          radius="0.026"
          position="0.82 0.29 0.02"
          material="color: #d6b06a; emissive: #d6b06a; emissiveIntensity: 1.5; shader: flat; fog: false"
        ></a-sphere>

        <!-- Programme and policy are separated into readable levels -->
        <a-text
          value="PROGRAM SOKONGAN PROFESIONAL:"
          align="center"
          color="#f2f6ff"
          width="3.92"
          wrap-count="38"
          letter-spacing="1.2"
          position="0 0.01 0.02"
        ></a-text>
        <a-text
          value="DASAR PENDIDIKAN DIGITAL"
          align="center"
          color="#bfefff"
          width="3.65"
          wrap-count="30"
          letter-spacing="2.4"
          position="0 -0.36 0.02"
        ></a-text>

        <!-- Cyan datum line visually connects the title to the energy orb -->
        <a-plane
          width="1.15"
          height="0.012"
          position="0 -0.66 0.02"
          material="color: #6eeaff; emissive: #4edfff; emissiveIntensity: 1.3; opacity: 0.82; transparent: true; fog: false"
        ></a-plane>
      </a-entity>

      <!-- ============ FLOATING FILM SCREEN (hidden until launch) ============ -->
      <a-entity id="filmScreen" position="0 1.6 -4.4" visible="false">
        <!-- Dark backdrop + thin bezel so it reads as a real screen -->
        <a-plane
          width="6.75"
          height="3.85"
          position="0 0 -0.04"
          material="color: #04060e; emissive: #04060e; emissiveIntensity: 0.15; side: double; fog: false"
        ></a-plane>
        <a-plane
          width="6.6"
          height="3.72"
          position="0 0 -0.02"
          material="color: #0a1428; emissive: #0f1d3a; emissiveIntensity: 0.3; metalness: 0.6; roughness: 0.4; side: double; fog: false"
        ></a-plane>

        <!-- Opening film -->
        <a-video
          id="screenVideo"
          src="#openingVideo"
          width="6.4"
          height="3.6"
          position="0 0 0.02"
          visible="false"
        ></a-video>

        <!-- Placeholder (shown only if opening.mp4 is missing) -->
        <a-entity id="screenPlaceholder" visible="false" position="0 0 0.03">
          <a-plane
            width="6.4"
            height="3.6"
            material="color: #05080f; emissive: #060a14; emissiveIntensity: 0.4; fog: false"
          ></a-plane>
          <a-text
            value="FILEM PEMBUKAAN\n\n(letakkan fail anda di assets/opening.mp4)"
            align="center"
            color="#cfe0ff"
            width="5.5"
            position="0 0 0.02"
          ></a-text>
        </a-entity>
      </a-entity>

      <!-- ============ FLOATING LAUNCH ORB (the clickable target) ============ -->
      <a-entity id="orbGroup" position="0 1.3 -0.75">
        <a-plane
          width="0.52"
          height="0.52"
          position="0 0 0.01"
          material="src: #palmOrbTexture; shader: flat; transparent: true; opacity: 0.95; blending: additive; depthWrite: false; side: double; fog: false"
          animation__pulse="property: scale; dir: alternate; to: 1.035 1.035 1.035; loop: true; dur: 1500; easing: easeInOutSine"
          animation__float="property: position; dir: alternate; to: 0 0.035 0.01; loop: true; dur: 2200; easing: easeInOutSine"
        ></a-plane>
        <a-plane
          width="0.58"
          height="0.58"
          material="src: #palmOrbTexture; shader: flat; transparent: true; opacity: 0.16; blending: additive; depthWrite: false; side: double; fog: false"
          animation__turn="property: rotation; to: 0 0 -360; loop: true; dur: 24000; easing: linear"
          animation__pulse="property: scale; dir: alternate; to: 1.08 1.08 1.08; loop: true; dur: 2100; easing: easeInOutSine"
        ></a-plane>
        <a-sphere
          id="orb"
          class="clickable"
          launch-button
          touch-launch="threshold: 0.24"
          radius="0.18"
          material="color: #000000; opacity: 0.001; transparent: true; depthWrite: false; fog: false"
        ></a-sphere>
      </a-entity>

      <!-- ============ CAMERA RIG + CONTROLLERS ============ -->
      <a-entity id="rig" position="0 1.6 0">
        <a-camera position="0 0 0" wasd-controls="acceleration: 40" look-controls>
          <!-- Desktop clicks use the real mouse position; VR uses controller rays. -->
          <a-entity
            id="gazeCursor"
            cursor="rayOrigin: mouse; fuse: false"
            raycaster="objects: .clickable; far: 30"
            material="color: #d6b06a; shader: flat"
            geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
          ></a-entity>
        </a-camera>

        <!-- Controllers: laser aim + trigger -->
        <a-entity
          id="leftHand"
          laser-controls="hand: left"
          raycaster="objects: .clickable; far: 30; lineColor: #d6b06a; lineOpacity: 0.9"
        ></a-entity>
        <a-entity
          id="rightHand"
          laser-controls="hand: right"
          raycaster="objects: .clickable; far: 30; lineColor: #d6b06a; lineOpacity: 0.9"
        ></a-entity>
        <!-- Bare-hand tracking: touching the orb also launches -->
        <a-entity id="leftHandTrack" hand-tracking-controls="hand: left"></a-entity>
        <a-entity id="rightHandTrack" hand-tracking-controls="hand: right"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
