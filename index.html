<!DOCTYPE html>
<html lang="ms">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Pelancaran PRIME – Jejak Impak</title>

    <!-- Vendored locally so it also works offline at the venue -->
    <script src="vendor/aframe.min.js"></script>
    <script src="js/sky-band.js"></script>
    <script src="js/local-media.js" defer></script>
    <script src="js/launch.js?v=20260926-prime30" defer></script>

    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #040c1b;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      #simulatorHint[hidden] {
        display: none;
      }

      #simulatorHint {
        position: fixed;
        z-index: 9999;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        max-width: calc(100vw - 40px);
        padding: 9px 14px;
        border: 1px solid rgba(126, 220, 255, 0.42);
        border-radius: 4px;
        background: rgba(3, 10, 24, 0.82);
        box-shadow: 0 0 24px rgba(56, 183, 255, 0.16);
        color: #d9f5ff;
        font-size: 12px;
        letter-spacing: 0.05em;
        line-height: 1.45;
        text-align: center;
        pointer-events: none;
      }

      #offlineMediaPanel {
        position: fixed;
        z-index: 10000;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        width: min(440px, calc(100vw - 36px));
        padding: 16px;
        border: 1px solid rgba(126, 220, 255, 0.42);
        border-radius: 12px;
        background: rgba(3, 10, 24, 0.94);
        box-shadow: 0 0 28px rgba(56, 183, 255, 0.2);
        color: #e8f7ff;
        text-align: center;
      }

      #offlineMediaPanel[hidden] {
        display: none;
      }

      #offlineMediaPanel strong,
      #offlineMediaStatus {
        display: block;
      }

      #offlineMediaStatus {
        margin: 8px 0 13px;
        color: #b9d6e5;
        font-size: 13px;
        line-height: 1.45;
      }

      #offlineMediaStatus[data-kind="ready"] { color: #97f5c2; }
      #offlineMediaStatus[data-kind="error"] { color: #ffd08a; }

      #localMediaFields {
        display: grid;
        gap: 8px;
        margin: 10px 0 13px;
        text-align: left;
      }

      .localMediaField {
        display: grid;
        gap: 5px;
        padding: 8px 10px;
        border: 1px solid rgba(126, 220, 255, 0.26);
        border-radius: 7px;
        color: #b9d6e5;
        font-size: 12px;
      }

      .localMediaField input {
        width: 100%;
        color: #e8f7ff;
      }

      #prepareOfflineButton {
        border: 1px solid #8ad9ff;
        border-radius: 6px;
        padding: 10px 15px;
        background: #0c4d83;
        color: #fff;
        font: inherit;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      #prepareOfflineButton:disabled { opacity: 0.72; }

    </style>
  </head>

  <body>
    <!-- Operator-only note (desktop). Auto-hides once VR starts so it is never
         part of the scene the audience sees. -->
    <div id="hint" hidden>
      Operator sahaja &nbsp;·&nbsp; SPACE / L = mula &nbsp;·&nbsp; ESC = kembali ke sfera
    </div>

    <div id="simulatorHint" hidden>
      MOD UJIAN VR &nbsp;·&nbsp; Seret tetikus: pandang &nbsp;·&nbsp; W/A/S/D: bergerak
      &nbsp;·&nbsp; R: pusat semula &nbsp;·&nbsp; Klik sfera: mula
    </div>

    <section id="offlineMediaPanel" aria-live="polite">
      <strong>PERSEDIAAN FILEM DALAM HEADSET</strong>
      <span id="offlineMediaStatus">Pilih Pelancaran.mp4 yang telah disalin ke headset. Fail tidak akan dimuat turun dari Internet.</span>
      <div id="localMediaFields">
        <label class="localMediaField">FILEM PELANCARAN<input id="filmFile" type="file" accept="video/mp4,video/*" /></label>
      </div>
      <button id="prepareOfflineButton" type="button" disabled>GUNA FAIL TEMPATAN</button>
    </section>

    <a-scene
      launch-sequence
      background="color: #040c1b"
      renderer="colorManagement: true; antialias: true; exposure: 1; toneMapping: no"
      loading-screen="dotsColor: #d7a66d; backgroundColor: #040c1b"
    >
      <!-- ============ ASSETS ============ -->
      <a-assets>
        <!--
          CEREMONY FILM (Pelancaran.mp4), chosen from the Quest's local storage.
          Plays with sound in the headset (?filmAudio=0 mutes it).
        -->
        <video
          id="openingVideo"
          preload="none"
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
        <!-- Built by tools/make-assets.sh / tools/make-logo.py -->
        <img id="skyTexture" src="assets/sky-galaxy.jpg" />
        <img id="jpnLogo" src="assets/logo-jata-negara.png" />
      </a-assets>

      <!-- ============ GALAXY (matches the film's first frame) ============ -->
      <!-- The sky never moves; its light flows, stars twinkle, meteors pass. -->
      <a-entity id="sky" sky-yaw>
        <a-entity galaxy-sky="src: #skyTexture; radius: 400; flow: 0.7; speed: 3"></a-entity>
        <a-entity galaxy-stars="count: 2600; radius: 350"></a-entity>
        <a-entity shooting-stars="radius: 300"></a-entity>
      </a-entity>

      <!-- Faint motes drifting around the wearer (fade out when the film starts) -->
      <a-entity id="spaceDust" space-dust></a-entity>

      <!-- Dimmer shell: darkens the galaxy behind the film screen after launch -->
      <a-sphere
        id="dimmer"
        radius="60"
        material="color: #000005; shader: flat; side: back; opacity: 0; transparent: true; fog: false; depthWrite: false"
      ></a-sphere>

      <!-- Standby content follows the wearer, then locks in place on launch. -->
      <a-entity id="ceremonyAnchor" position="0 1.6 0" standby-anchor>
        <!-- ============ FILM SCREEN (hidden until launch) ============ -->
        <!-- Centre 12° below eye level: comfortable for a 69 s film, and still in view
             right after the flash while the wearer is looking down at the orb (-22°). -->
        <a-entity id="filmScreen" rotation="-12 0 0" visible="false">
          <!-- Nested cylindrical surfaces form a restrained curved bezel. -->
          <a-entity curved-panel="radius: 5.86; height: 4.36; arc: 73.5; color: #040c1b"></a-entity>
          <a-entity curved-panel="radius: 5.83; height: 4.22; arc: 72.7; color: #3a2c14"></a-entity>
          <a-entity
            id="screenVideo"
            curved-video="src: #openingVideo; radius: 5.8; height: 4.1; arc: 72; opacity: 0"
            visible="false"
          ></a-entity>
        </a-entity>

        <!-- ============ TITLE: JPN emblem + launch title ============ -->
        <!-- 4.2 m away, centred 11° above eye level (above the orb), facing the wearer. -->
        <a-entity id="titleCard" position="0 0.8 -4.12" rotation="11 0 0" title-card="logo: #jpnLogo; width: 4.6"></a-entity>

        <!-- ============ GOLDEN ORB (the touch target) ============ -->
        <a-entity id="orbGroup" position="0 -0.3 -0.75" ceremony-orb="diameter: 0.38">
          <a-sphere
            id="orb"
            class="clickable"
            launch-button
            touch-launch="threshold: 0.24"
            radius="0.19"
            material="color: #000000; opacity: 0.001; transparent: true; depthWrite: false; fog: false"
          ></a-sphere>
        </a-entity>
      </a-entity>

      <!-- GPU gold particles released as the orb bursts. -->
      <a-entity id="launchParticles" orb-dissolve="count: 420; duration: 1320"></a-entity>

      <!-- ============ CAMERA RIG + CONTROLLERS ============ -->
      <a-entity id="rig" position="0 0 0">
        <a-camera position="0 1.6 0" wasd-controls="acceleration: 40" look-controls>
          <!-- Head-locked white-gold flash covering the cut to the film -->
          <a-entity id="launchFlash" position="0 0 -0.3" launch-flash></a-entity>
          <!-- Desktop clicks use the real mouse position; VR uses controller rays. -->
          <a-entity
            id="gazeCursor"
            cursor="rayOrigin: mouse; fuse: false"
            raycaster="objects: .clickable; far: 30"
          ></a-entity>
        </a-camera>

        <!-- Controllers: laser aim + trigger -->
        <a-entity
          id="leftHand"
          laser-controls="hand: left"
          raycaster="objects: .clickable; far: 30; lineColor: #d7a66d; lineOpacity: 0.9"
        ></a-entity>
        <a-entity
          id="rightHand"
          laser-controls="hand: right"
          raycaster="objects: .clickable; far: 30; lineColor: #d7a66d; lineOpacity: 0.9"
        ></a-entity>
        <!-- Bare-hand tracking: touching the orb also launches -->
        <a-entity id="leftHandTrack" hand-tracking-controls="hand: left"></a-entity>
        <a-entity id="rightHandTrack" hand-tracking-controls="hand: right"></a-entity>
      </a-entity>
    </a-scene>
  </body>
</html>
